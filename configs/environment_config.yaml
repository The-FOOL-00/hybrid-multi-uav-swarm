baseline_navigation:
  active_uav: 0
  altitude: 15.0
  arrival_radius: 3.0
  astar_enabled: true
  avoidance_strength: 1.5
  collision_safety:
    danger_radius: 2.5
    enabled: true
    planner_inflation_radius: 2.5
    repulsion_emergency_radius: 1.0
    repulsion_smoothing: 0.3
    repulsion_strength: 1.5
    repulsion_strength_warn: 0.4
    safety_inflation_radius: 2.5
    segment_blocked_fallback: nearest_free
    segment_samples: 30
    show_avoidance_vector: true
    show_inflated_obstacles: false
  cruise_speed: 0.04
  cruise_velocity: 0.04
  decel_radius: 5.0
  emergency_radius: 3.0
  enabled: true
  grid_margin: 90.0
  grid_resolution: 2.0
  local_avoidance:
    astar_weight: 0.65
    avoidance_weight: 0.35
    corridor_commit_steps: 12
    debug_rays: true
    emergency_slow_scale: 0.45
    enabled: true
    prediction_steps: 12
    ray_samples: 20
    red_threshold: 0.3
    repulsion_falloff: 2.0
    sensor_distance: 14.0
    slow_mid_distance: 5.0
    slow_mid_scale: 0.8
    slow_near_distance: 3.0
    slow_near_scale: 0.6
    slow_start_distance: 8.0
    smoothing_alpha: 0.35
    yellow_threshold: 0.6
  log_interval_steps: 100
  max_acceleration: 0.005
  max_steps: 12000
  max_turn_rate: 0.03
  max_velocity: 0.06
  obstacle_inflation: 2.5
  planner:
    astar:
      heuristic: euclidean
    dijkstra: null
    potential_field:
      attractive_gain: 1.0
      goal_threshold: 1.0
      influence_distance: 15.0
      max_steps: 1000
      repulsive_gain: 15.0
    rrt:
      bidirectional: true
      max_iterations: 5000
      step_size: 2.0
    type: astar
  safety_radius: 5.0
  show_waypoint_markers: true
  start_position:
  - -40.0
  - -40.0
  - 15.0
  target_position:
  - 40.0
  - 40.0
  - 15.0
  target_strength: 1.0
  velocity_damping_factor: 0.92
  visualization:
    marker_radius_target: 0.9
    marker_radius_wp: 0.6
    show_debug_beacon: false
    show_waypoint_markers: true
    trail_interval_steps: 15
    trail_sphere_radius: 0.2
  waypoint_radius: 2.5
  waypoint_reach_lock_steps: 8
  wp_damping_radius: 2.0
  yaw_smoothing_alpha: 0.2
birds:
  altitude_max: 12.0
  altitude_min: 4.0
  controller: bird_controller
  orbit_radius_base: 10.0
  speed_rad_per_s: 0.25
crowd:
  pedestrian_height_z: 1.27
  state_machine: true
  states:
  - WALK
  - WAIT
  - GATHER
  walk_speed_max: 1.6
  walk_speed_min: 0.8
logging:
  metrics:
  - coverage_percent
  - crowd_agents_in_fov
  - active_uavs
  - uav_positions
  metrics_interval_steps: 125
  output_dir: experiments/logs/
physics:
  gravity: -9.806
  uav_damping:
    angular: 0.5
    linear: 0.5
  wind:
    base_speed: 2.0
    direction:
    - 1.0
    - 0.0
    - 0.5
    enabled: false
    turbulence: 0.3
pomdp:
  attention_alpha: 0.15
  coverage_cell_size: 5.0
  observation_radius: 12.0
  reward_coverage_weight: 0.6
  reward_tracking_weight: 0.4
project:
  guide: Dr. E. Selvam
  institution: SSN College of Engineering
  name: Attention-Guided Multi-UAV Surveillance
  researchers:
  - Sharruk S
  - Sundareswaran
  - Jeswin Joel
  version: '1.0'
rl:
  algorithm: PPO
  enabled: false
  episodes: 1000
  gamma: 0.99
  learning_rate: 0.0003
  max_steps_per_episode: 5000
  reward_weights:
    collision_penalty: -1.0
    coverage: 0.6
    overlap_penalty: 0.3
    separation_reward: 0.05
    tracking: 0.4
scenarios:
  downtown:
    area_m2: 40000
    birds: 8
    buildings: 15
    crowd_agents: 15
    description: Dense urban with high-rise buildings and 3x3 road grid
    patrol_altitude: 15.0
    patrol_radius: 45.0
    uav_count: 5
    world_file: worlds/downtown.wbt
  event:
    area_m2: 25600
    birds: 8
    buildings: 5
    crowd_agents: 40
    description: Dense crowd gathering in central 50x50m plaza
    patrol_altitude: 12.0
    patrol_radius: 15.0
    uav_count: 5
    world_file: worlds/event.wbt
  industrial:
    area_m2: 32400
    birds: 5
    buildings: 2
    crowd_agents: 10
    description: Industrial port with stacked shipping containers and warehouses
    patrol_altitude: 12.0
    patrol_radius: 18.0
    uav_count: 5
    world_file: worlds/industrial.wbt
  mixed:
    area_m2: 32400
    birds: 8
    buildings: 14
    crowd_agents: 35
    description: Mixed commercial (offices/shops) and residential zones
    patrol_altitude: 15.0
    patrol_radius: 20.0
    uav_count: 5
    world_file: worlds/mixed.wbt
  residential:
    area_m2: 25600
    birds: 6
    buildings: 8
    crowd_agents: 8
    description: Low-density neighborhood with parks and curved roads
    patrol_altitude: 10.0
    patrol_radius: 15.0
    uav_count: 5
    world_file: worlds/residential.wbt
  single_drone:
    area_m2: 40000
    birds: 8
    buildings: 8
    crowd_agents: 15
    description: "[DEMO] Single-drone obstacle navigation showcase \xE2\u20AC\u201D\
      \ 8 buildings"
    mission_start:
    - -40.0
    - -40.0
    - 15.0
    mission_target:
    - 40.0
    - 40.0
    - 15.0
    patrol_altitude: 15.0
    patrol_radius: 45.0
    uav_count: 1
    world_file: worlds/single_drone_downtown.wbt
uav:
  controller: uav_swarm_controller
  count: 5
  formation: circular_staggered
  model: Mavic2Pro
  motion_mode: supervisor_teleport
webots:
  coordinate_system: ENU
  timestep: 16
  version: R2025a
  webots_exe: C:/Program Files/Webots/webots.exe
